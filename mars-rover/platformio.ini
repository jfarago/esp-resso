[platformio]
default_envs = seeed_xiao_esp32c6

[env:seeed_xiao_esp32c6]
; The official espressif32 platform has no Arduino support for the C6 (core 2.x only).
; pioarduino provides Arduino core 3.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_extra_dirs = ../lib

; Wireless upload: OTA_PASSWORD=<same as secrets.h> pio run -e ota -t upload
; Needs the OTA firmware already on the board (first flash over USB).
[env:ota]
extends = env:seeed_xiao_esp32c6
upload_protocol = espota
upload_port = mars-rover.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}
